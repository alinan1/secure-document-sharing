<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Document Sharing</title>
</head>
<body>
    <h1>Secure Document Sharing System</h1>

    {% if current_user %}
        <p>You are logged in as <strong>{{ current_user }}</strong>.</p>
        <a href="/dashboard">Go to Dashboard</a><br><br>
        <a href="/logout">Logout</a>
    {% else %}
        <p>You are not logged in.</p>
        <a href="/register">Go to Register Page</a><br><br>
        <a href="/login">Go to Login Page</a>
    {% endif %}
</body>
</html>
